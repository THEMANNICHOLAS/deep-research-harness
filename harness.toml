# Harness config surface (D3, docs/plans/PLAN-harness-substrate.md).
#
# The `TODO` values below are deployment facts not established anywhere in this
# repo — the OpenCode base URL, the exact model IDs, and the developer's SearXNG
# URL. Fill them in before `load_config()` will produce a usable runtime config.
# Secrets are never stored here — each provider names an environment variable
# (see `.env.example`), resolved at load time.

[providers.opencode]
base_url = "TODO"                    # TODO: OpenCode API base URL, e.g. https://<host>/v1
api_key_env = "OPENCODE_API_KEY"

[providers.cerebras]
base_url = "https://api.cerebras.ai/v1"
api_key_env = "CEREBRAS_API_KEY"

[roles.head]
provider = "opencode"
model = "TODO"                       # TODO: OpenCode head-model ID, e.g. glm-5.2

[roles.subagent]
provider = "cerebras"
model = "TODO"                       # TODO: Cerebras worker-model ID, e.g. gemma-4-31b

[fetch]
page_timeout_ms = 15000
http_concurrency = 10
http_deadline_ms = 3000
max_retries = 2
per_page_char_cap = 12000
max_urls_per_call = 5
min_markdown_words = 50
browser_deadline_ms = 20000
browser_concurrency = 2
downloads_dir = "workspace/downloads"

[search]
base_url = "http://localhost:8080"   # local dev instance — see searxng/docker-compose.yml
default_max_results = 10
