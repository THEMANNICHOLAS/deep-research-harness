# Harness config surface (D3, docs/plans/PLAN-harness-substrate.md).
#
# Secrets are never stored here — each provider names an environment variable
# (see `.env.example`), resolved at load time. Note that EVERY declared provider
# has its key resolved at load, whether or not a role uses it, which is why only
# the providers actually in use are declared below.

# `base_url` is the API base, not a full endpoint — the OpenAI-compatible client
# appends `/chat/completions` itself.
[providers.opencode]
base_url = "https://opencode.ai/zen/go/v1"
api_key_env = "OPENCODE_API_KEY"

[roles.head]
provider = "opencode"
model = "deepseek-v4-flash"

[roles.subagent]
provider = "opencode"
model = "gpt-5.6-luna"

[fetch]
page_timeout_ms = 15000
max_concurrency = 5
per_page_char_cap = 12000
max_urls_per_call = 5  # bounds one fetch_pages call, not the run (R9/D11)

[search]
base_url = "http://localhost:8080"   # local dev instance — see searxng/docker-compose.yml
default_max_results = 10

[agent]
# Frozen surface for the agent loop (Phase 3) and its workspace/report capture
# (Phase 2) — see docs/plans/PLAN-research-loop.md.
max_rounds = 20
wall_clock_seconds = 1800
# workspace_dir/reports_dir now default to ~/deep-research/{workspace,reports}; set either
# key here to override.
max_retries = 2
request_timeout_seconds = 120.0
