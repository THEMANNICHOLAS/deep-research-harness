# Harness config surface (D3, docs/plans/PLAN-harness-substrate.md).
#
# Secrets are never stored here — each provider names an environment variable
# (see `.env.example`), resolved at load time. Note that EVERY declared provider
# has its key resolved at load, whether or not a role uses it, which is why only
# the providers actually in use are declared below.

# `base_url` is the API base, not a full endpoint — the OpenAI-compatible client
# appends `/chat/completions` itself.
[providers.opencode]
base_url = "https://opencode.ai/zen/go/v1"
api_key_env = "OPENCODE_API_KEY"

[roles.head]
provider = "opencode"
model = "kimi-k3"
# Developer-confirmed slug IDs for the `/model` picker (Phase 2) — an in-memory-only
# swap of roles.head.model, never written back to this file.
choices = [
  "grok-4.5",
  "glm-5.3",
  "glm-5.2",
  "glm-5.1",
  "gpt-5.6-luna",
  "kimi-k3",
  "kimi-k2.7-code",
  "kimi-k2.6",
  "mimo-v2.5",
  "mimo-v2.5-pro",
  "minimax-m3",
  "minimax-m2.7",
  "qwen3.8-max",
  "qwen3.7-max",
  "qwen3.7-plus",
  "qwen3.6-plus",
  "deepseek-v4-pro",
  "deepseek-v4-flash",
  "hy3",
]

[roles.researcher]
provider = "opencode"
model = "deepseek-v4-pro"

[roles.reader]
provider = "opencode"
model = "deepseek-v4-flash"

# D4: verification runs on a model that did not write the report.
[roles.verifier]
provider = "opencode"
model = "qwen3.7-plus"

[fetch]
page_timeout_ms = 15000
max_concurrency = 5  # per-call dispatcher permits
max_connections = 24  # run-wide warm HTTP pool shared by all researchers (D3); NOT per call
memory_threshold_percent = 90.0  # crawl4ai default; lower on a <16GB box also running SearXNG + Chromium
per_page_char_cap = 120000  # ~30k tokens per source at ~4 chars/token
max_urls_per_call = 5  # bounds one fetch_pages call, not the run (R9/D11)
min_markdown_words = 50  # below this, an HTTP-fetched page escalates to Chromium once (R6/D2)

[search]
base_url = "http://localhost:8080"   # local dev instance — see searxng/docker-compose.yml
default_max_results = 10
max_consecutive_failures = 3  # R2: consecutive connection-level search failures that abort the run

[guard]
# R1: heuristic injection scanner over fetched pages and search results — see
# docs/plans/PLAN-prompt-injection-defense.md. Toggles detection only; byte
# sanitization of survivor markdown always runs.
enabled = true

[blocklist]
# R3/R4: cross-session hostname blocklist fed by deliberate anti-bot refusals
# (401/403/challenge page) — see docs/plans/PLAN-tool-feedback-and-domain-blocklist.md.
# path defaults to ~/deep-research/blocked-domains.json; set the key below to override.
# path = "custom-blocked-domains.json"

[agent]
# Frozen surface for the agent loop (Phase 3) and its workspace/report capture
# (Phase 2) — see docs/plans/PLAN-research-loop.md.
max_rounds = 50
wall_clock_seconds = 1800
# R7: reserve measured back from wall_clock_seconds above at which a bounded synthesis pass
# fires instead of running out the hard clock. 0 disables it.
synthesis_margin_seconds = 240
# workspace_dir/reports_dir now default to ~/deep-research/{workspace,reports}; set either
# key here to override.
max_retries = 2
request_timeout_seconds = 120.0
# Harness-enforced (R5): a researcher's reader dispatch past this count is refused, not
# merely advised in prompt prose. The researcher prompt renders this same value.
max_reader_dispatches = 6
# Harness-enforced (D5): a CONCURRENCY cap on how many researcher dispatches the lead may
# have in flight at once — NOT a total for the run, so a second wave is allowed once the
# first returns. The surplus dispatch is refused with a message telling the lead to wait.
# This value is rendered into the lead prompt, so the model is told the limit it is held to.
max_concurrent_researchers = 4
# Prompt-only (D5): a budget rendered into the researcher prompt, NOT enforced — nothing
# counts a researcher's searches. max_reader_dispatches above is what bounds cost in code.
searches_per_researcher = 4
