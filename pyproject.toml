[project]
name = "fast-research-harness"
version = "0.1.0"
description = "Self-hosted, Perplexity-style research agent with cited sources, built as a reusable agent-loop/tool-registry harness."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "langchain-core>=0.3",
    # Pinned, not ranged: 0.9.x is a moving series and 0.9.0 was a breaking
    # release. A signature mismatch against the plan's contracts is a version
    # problem to surface, not a contract to rewrite. See plan risk #3.
    "crawl4ai==0.9.2",
    "httpx>=0.27",
    # Pinned, not ranged: 0.7.x is a fast-moving line and 0.7.0 was a breaking
    # minor release. Any bump is a deliberate act, not an incidental `uv sync`.
    # See the plan's risk #2.
    "deepagents==0.7.5",
    # Pinned for the same reason as `deepagents`, and because the floor it shipped
    # with (">=0.3") had already floated three majors to 1.4.2 in uv.lock. It wraps
    # `ChatOpenAI`, which `harness/models.py` builds directly and `tests/conftest.py`'s
    # `ScriptedChatModel` subclasses, so a silent bump moves the request body that
    # `preflight` depends on. See PR #4 review.
    "langchain-openai==1.4.2",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    # Pinned exactly, per the project convention that requirements carry `==`
    # rather than a `>=` floor — a floor still lets the resolved version float.
    "pytest-cov==7.1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
# 3.12, not 3.11: numpy's stubs (transitive via crawl4ai, reached through
# pytest.approx) use a PEP 695 `type` statement that is a syntax error under
# 3.11 and aborts the whole run. Note this is looser than requires-python
# (">=3.11") — a 3.11-incompatible construct in harness/ will not be caught here.
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# The measured base is `harness/` only — `tests/` is deliberately excluded (R3), and
# this is the single place that scope is defined. The failure threshold is NOT here:
# it is passed by the CI step alone (D4), which is the one place it is written, so a
# local `uv run pytest` on a single test file stays fast and ungated.
[tool.coverage.run]
source = ["harness"]

[tool.coverage.report]
show_missing = true

[tool.uv]
package = false
# Pinned exactly, not a `>=` floor: `astral-sh/setup-uv` reads this file to decide
# which uv to install, and with no constraint it logs "Falling back to latest" — so
# the action's SHA pin fixes the action, not uv itself. A floor would still float.
# Bumping uv is now a deliberate edit here, and CI, the workstation, and a rebuilt
# VM all run the same one. See docs/plans/PLAN-ci-pipeline.md `## Discoveries`.
required-version = "==0.12.3"
