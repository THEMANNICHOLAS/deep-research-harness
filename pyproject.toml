[project]
name = "fast-research-harness"
version = "0.1.0"
description = "Self-hosted, Perplexity-style research agent with cited sources, built as a reusable agent-loop/tool-registry harness."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "langchain-core>=0.3",
    # Pinned, not ranged: 0.9.x is a moving series and 0.9.0 was a breaking
    # release. A signature mismatch against the plan's contracts is a version
    # problem to surface, not a contract to rewrite. See plan risk #3.
    "crawl4ai==0.9.2",
    "httpx>=0.27",
    # Pinned, not ranged: 0.7.x is a fast-moving line and 0.7.0 was a breaking
    # minor release. Any bump is a deliberate act, not an incidental `uv sync`.
    # See the plan's risk #2.
    "deepagents==0.7.5",
    "langchain-openai>=0.3",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
# 3.12, not 3.11: numpy's stubs (transitive via crawl4ai, reached through
# pytest.approx) use a PEP 695 `type` statement that is a syntax error under
# 3.11 and aborts the whole run. Note this is looser than requires-python
# (">=3.11") — a 3.11-incompatible construct in harness/ will not be caught here.
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
