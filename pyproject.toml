[project]
name = "fast-research-harness"
version = "0.1.0"
description = "Self-hosted, Perplexity-style research agent with cited sources, built as a reusable agent-loop/tool-registry harness."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "mypy",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.uv]
package = false
